name: Deploy plugin tutorial

on:
  push:
    branches:
      - main
      - master
    paths:
      - "plugin-tutorial/**"
      - ".github/workflows/deploy-plugin-tutorial.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          node plugin-tutorial/scripts/generate-helper-pages.mjs
          cp -R plugin-tutorial _site
          find _site -name "*.html" -print0 | xargs -0 perl -0pi -e "s#(href=\"(?:\\.\\./|\\./|\\.\\./\\.\\./)?styles\\.css)(\")#\${1}?v=${GITHUB_SHA}\${2}#g; s#(src=\"(?:\\.\\./|\\./|\\.\\./\\.\\./)?(?:script|helpers-page|helper-detail|connect)\\.js)(\")#\${1}?v=${GITHUB_SHA}\${2}#g"
          find _site -name "*.js" -print0 | xargs -0 perl -0pi -e "s#from \"((?:\\.\\./|\\./)?course-data\\.mjs)\"#from \"\${1}?v=${GITHUB_SHA}\"#g"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
